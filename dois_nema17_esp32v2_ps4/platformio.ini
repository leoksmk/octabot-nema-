; PlatformIO - Octabot v2 PS4 (ESP32 DevKit v1 + Bluepad32)
;
; ANTES DO PRIMEIRO BUILD, rode uma vez nesta pasta:   python preparar_bluepad32.py
; (baixa o framework Arduino + Bluepad32 e corrige o nome do pacote para o PlatformIO aceitar)
;
; O mesmo dois_nema17_esp32v2_ps4.ino continua abrindo na Arduino IDE.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
; 6.9.0 = Arduino-ESP32 2.0.17 + compilador 8.4.0, os mesmos da Bluepad32 4.1.0
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ symlink://.bluepad32/framework

; 3 MB para o programa (sem OTA). O padrao (1,25 MB) fica ~91% cheio com WiFi + Bluetooth.
board_build.partitions = huge_app.csv

; so o .ino entra no build (o PlatformIO converte em .ino.cpp; a pasta simulacao/ e para o PC)
build_src_filter = +<dois_nema17_esp32v2_ps4.ino.cpp>

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6

monitor_speed = 115200
; traduz o "Guru Meditation" (travamento) em nome de funcao e linha
monitor_filters = esp32_exception_decoder
